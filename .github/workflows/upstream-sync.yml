name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily (midnight-2 AM Eastern)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/nyldn/claude-octopus.git || true
          git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/main)
          LOCAL=$(git rev-parse origin/main)
          if [ "$UPSTREAM" = "$LOCAL" ]; then
            echo "No new upstream commits — nothing to do."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list origin/main..upstream/main --count)
            echo "Found $COUNT new upstream commit(s)."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create or reset sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git checkout -B upstream-sync upstream/main
          # Preserve our own workflow and script files — we control our own CI, not upstream
          git checkout origin/main -- .github/workflows/ .github/scripts/
          git commit -m "ci: preserve fork workflow and script files" --allow-empty
          git push origin upstream-sync --force

      - name: Generate AI security review
        if: steps.check.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/ai_security_review.py

      - name: Apply security hardening patches
        if: steps.check.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/security-harden.py

      # Guard: the hardening pass rewrites shell scripts textually. If any rewrite
      # produces invalid bash, fail loudly here instead of opening a clean PR that
      # silently ships broken hooks (regression: harden bot emitted unbalanced
      # quotes / a comment inside [[ ]], breaking 3 hooks — caught only post-merge).
      - name: Validate shell syntax after hardening
        if: steps.check.outputs.has_changes == 'true'
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f" 2>/tmp/synerr; then
              echo "::error file=$f::invalid bash syntax after hardening"
              sed 's/^/    /' /tmp/synerr
              status=1
            fi
          done < <(find hooks .claude-plugin/hooks .claude/hooks bin scripts \
                     -type f \( -name '*.sh' -o -name '*.bash' \) -print0 2>/dev/null)
          if [ "$status" -ne 0 ]; then
            echo "Shell syntax validation failed — see errors above. Not opening PR."
            exit 1
          fi
          echo "All shell scripts pass bash -n."

      - name: Open or update PR
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(git log origin/main..upstream/main --oneline)
          DATE=$(date +%Y-%m-%d)

          cat > /tmp/pr_body.md << 'BODYEOF'
          ## Upstream Sync

          **New commits from [nyldn/claude-octopus](https://github.com/nyldn/claude-octopus)**

          BODYEOF

          echo '```' >> /tmp/pr_body.md
          echo "$COMMITS" >> /tmp/pr_body.md
          echo '```' >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "---" >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "## AI Security Review" >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          cat /tmp/ai_review.md >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "---" >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          cat /tmp/hardening_report.md >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "---" >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo '**After merging:**' >> /tmp/pr_body.md
          echo '1. `cd ~/Developer/devon-plugins/octo && git pull` — serving clone (what Claude Code actually loads)' >> /tmp/pr_body.md
          echo '2. Bump `version` in `~/Developer/devon-plugins/.claude-plugin/marketplace.json` to the new plugin version' >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "*Auto-generated by upstream-sync workflow*" >> /tmp/pr_body.md

          EXISTING=$(gh pr list \
            --repo alobarquest/claude-octopus \
            --base main \
            --head upstream-sync \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh pr edit "$EXISTING" \
              --repo alobarquest/claude-octopus \
              --title "Upstream sync — ${DATE}" \
              --body-file /tmp/pr_body.md
            echo "Updated PR #${EXISTING}"
          else
            gh pr create \
              --repo alobarquest/claude-octopus \
              --base main \
              --head upstream-sync \
              --title "Upstream sync — ${DATE}" \
              --body-file /tmp/pr_body.md
          fi

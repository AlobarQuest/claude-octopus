# claude-octopus: a Claude Code plugin (shell hooks, scripts and skills) installed on the operator
# machine by tool_installer's plugin strategy. Its root package.json carries only the version.
upstream = "nyldn/claude-octopus"
ecosystem = "npm-no-deps"
release_tag_pattern = '^v(\d+\.\d+\.\d+)$'
# The suites that read upstream's own .github/ are excluded: the lane removes it. So is the
# work-queue hook test, which assumes the checkout's remote is nyldn's, and the council contract,
# which upstream's own `make test-unit` excludes. The MCP server suite builds mcp-server, whose
# dependencies the lane never installs; .mcp.json registers no server, so nothing here runs it.
test_commands = [
  "make test-plugin-name",
  "./tests/run-all.sh smoke --exclude=smoke/test-packaging-integrity.sh",
  "./tests/run-all.sh unit --exclude=unit/test-council-command.sh --exclude=unit/test-mcp-server.sh --exclude=unit/test-github-work-queue-hook.sh --exclude=unit/test-ci-changed.sh --exclude=unit/test-explicit-activation.sh --exclude=unit/test-feature-policy.sh --exclude=unit/test-pr-review-workflow.sh --exclude=unit/test-reported-issue-pattern-coverage.sh --exclude=unit/test-retired-gemini-provider.sh --exclude=unit/test-suite-reachability.sh --exclude=unit/test-tangle-write-scope-safety.sh",
]

[review]
# What changes how the plugin reaches beyond itself: MCP servers it registers, Claude Code
# settings it manages, the path that installs the MCP server's dependencies, and the updater that
# names upstream's marketplace.
paths_watched = [
  ".mcp.json",
  "managed-settings.d/*",
  "scripts/ide-attach.sh",
  "scripts/lib/plugin-update.sh",
  # octo's dispatcher: its hooks run it in every session that uses octo, so every change to it is
  # read by a person (Devon, 2026-10-24; ADR-0056 amendment 7).
  "scripts/orchestrate.sh",
]
# What runs when the plugin loads or a command runs.
trust_critical = [
  ".claude-plugin/*",
  "hooks/*",
  "bin/*",
  "scripts/*",
  "mcp-server/src/*",
]
